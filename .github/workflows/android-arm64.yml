name: Android ARM64 build

on:
  push:
    branches:
      - deep-repair/android-opengl-hooks
  pull_request:
    branches:
      - deep-repair/android-opengl-hooks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android64:
    name: Build Geode Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: 5.9.0
          build-config: Release

      - name: Upload GEODE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterVisuals-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
