name: UltraScale Mobile Android CI

on:
  push:
    branches:
      - feature/ultrascale-mobile-api-injection-lab
    paths:
      - "experiments/UltraScaleMobile/**"
      - ".github/workflows/ultrascale-mobile-android.yml"
  pull_request:
    paths:
      - "experiments/UltraScaleMobile/**"
      - ".github/workflows/ultrascale-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultrascale-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android SDK 35 / JDK 17 / NDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build, lint and test
        working-directory: experiments/UltraScaleMobile/project
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug
      - name: Verify native graphics layers in APK
        shell: bash
        run: |
          set -euo pipefail
          apk="experiments/UltraScaleMobile/project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          entries="$(unzip -Z1 "$apk")"
          for abi in arm64-v8a armeabi-v7a; do
            for library in libVkLayer_ultrascale_api_lab.so libGLES_ultrascale.so; do
              expected="lib/$abi/$library"
              if ! grep -Fxq "$expected" <<< "$entries"; then
                echo "::error::Missing packaged native layer: $expected"
                exit 1
              fi
              echo "Verified $expected"
            done
          done
      - name: Verify bundled app shader library
        shell: bash
        run: |
          set -euo pipefail
          apk="experiments/UltraScaleMobile/project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          entries="$(unzip -Z1 "$apk")"
          for shader in amd_fsr1_easu.frag fsr_lite_6tap.frag mwsr_up.frag sgsr1_mobile.frag amd_cas_sharpen.frag; do
            expected="assets/upscalers/$shader"
            if ! grep -Fxq "$expected" <<< "$entries"; then
              echo "::error::Missing app shader asset: $expected"
              exit 1
            fi
            echo "Verified $expected"
          done
      - name: Verify sample game test APK and shaders
        shell: bash
        run: |
          set -euo pipefail
          apk="experiments/UltraScaleMobile/project/sample-game/build/outputs/apk/debug/sample-game-debug.apk"
          test -f "$apk"
          entries="$(unzip -Z1 "$apk")"
          for shader in sgsr1_mobile.frag fsr_lite_6tap.frag mwsr_up.frag amd_cas_sharpen.frag amd_fsr1_easu.frag; do
            expected="assets/shaders/$shader"
            if ! grep -Fxq "$expected" <<< "$entries"; then
              echo "::error::Missing sample-game shader asset: $expected"
              exit 1
            fi
            echo "Verified $expected"
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraScaleMobile-debug-apk
          path: |
            experiments/UltraScaleMobile/project/app/build/outputs/apk/debug/*.apk
            experiments/UltraScaleMobile/project/sample-game/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
