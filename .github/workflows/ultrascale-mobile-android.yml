name: UltraScale Mobile Android CI

on:
  push:
    branches:
      - feature/ultrascale-mobile-api-injection-lab
    paths:
      - "experiments/UltraScaleMobile/**"
      - ".github/workflows/ultrascale-mobile-android.yml"
  pull_request:
    paths:
      - "experiments/UltraScaleMobile/**"
      - ".github/workflows/ultrascale-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultrascale-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android SDK 35 / JDK 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/UltraScaleMobile/project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and verify
        run: gradle --no-daemon --stacktrace lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraScaleMobile-api-lab-debug
          path: experiments/UltraScaleMobile/project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
