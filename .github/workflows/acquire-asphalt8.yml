name: Acquire Asphalt 8 APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/acquire-asphalt8.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip aapt
          mkdir -p acquired/raw reports
      - name: Install apkeep
        run: cargo install apkeep --locked
      - name: Download Asphalt 8
        run: |
          set -euo pipefail
          apkeep -a com.gameloft.android.ANMP.GloftA8HM -d apk-pure -o acknowledge_dangers=true acquired/raw
          find acquired/raw -type f -printf '%p (%s bytes)\n'
          test -n "$(find acquired/raw -type f | head -n 1)"
      - name: Inspect and hash
        run: |
          set -euo pipefail
          for f in acquired/raw/*; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee -a reports/acquisition-report.txt
            case "$f" in *.apk) aapt dump badging "$f" | head -n 10 >> reports/acquisition-report.txt || true ;; *.xapk) unzip -l "$f" | head -n 30 >> reports/acquisition-report.txt ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: asphalt8-original-apkpure
          path: |
            acquired/raw/**
            reports/acquisition-report.txt
          if-no-files-found: error
          retention-days: 7
