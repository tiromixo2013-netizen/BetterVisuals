name: UltraScale Asphalt 8 APK acquisition lab

on:
  push:
    branches:
      - feature/ultrascale-mobile-api-injection-lab
    paths:
      - ".github/workflows/ultrascale-asphalt8-acquire.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultrascale-asphalt8-acquire
  cancel-in-progress: false

jobs:
  acquire-and-inspect:
    name: Download and inspect Asphalt 8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout UltraScale project
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install APK inspection tools
        run: |
          sdkmanager "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Pull prebuilt apkeep downloader
        run: docker pull ghcr.io/efforg/apkeep:stable

      - name: Download Asphalt 8 from APKPure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acquired/raw acquired/extracted reports
          docker run --rm \
            -v "$PWD/acquired/raw:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a com.gameloft.android.ANMP.GloftA8HM \
            -d apk-pure \
            -o 'acknowledge_dangers=true' \
            /output
          find acquired/raw -maxdepth 2 -type f -printf '%p (%s bytes)\n'
          test -n "$(find acquired/raw -type f | head -n 1)"

      - name: Normalize APK or XAPK and inspect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in acquired/raw/*; do
            case "$file" in
              *.xapk|*.zip)
                dest="acquired/extracted/$(basename "$file").contents"
                mkdir -p "$dest"
                unzip -q "$file" -d "$dest"
                ;;
              *.apk)
                mkdir -p acquired/extracted/single-apk
                cp "$file" acquired/extracted/single-apk/
                ;;
            esac
          done
          : > reports/asphalt8-inspection.txt
          echo "Acquisition time (UTC): $(date -u +%FT%TZ)" >> reports/asphalt8-inspection.txt
          echo "Expected package: com.gameloft.android.ANMP.GloftA8HM" >> reports/asphalt8-inspection.txt
          echo >> reports/asphalt8-inspection.txt
          mapfile -t apks < <(find acquired -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: downloader returned no APK files." | tee -a reports/asphalt8-inspection.txt
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "===== $apk =====" | tee -a reports/asphalt8-inspection.txt
            sha256sum "$apk" | tee -a reports/asphalt8-inspection.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" 2>&1 | head -n 35 | tee -a reports/asphalt8-inspection.txt || true
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" 2>&1 | tee -a reports/asphalt8-inspection.txt || true
            echo "Native libraries:" | tee -a reports/asphalt8-inspection.txt
            unzip -Z1 "$apk" | grep -E '^lib/[^/]+/.*\\.so$' | sort -u | tee -a reports/asphalt8-inspection.txt || true
            echo | tee -a reports/asphalt8-inspection.txt
          done
          echo "NOTE: No APK modifications or re-signing were performed in this acquisition job." >> reports/asphalt8-inspection.txt

      - name: Inventory game UI and graphics resources (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile, hashlib
          from pathlib import Path
          roots = [Path("acquired/raw"), Path("acquired/extracted")]
          out = Path("reports/asphalt8-resource-inventory.tsv")
          wanted_ext = {".xml",".json",".bson",".jpk",".pvs",".png",".webp",".jpg",".jpeg",".ktx",".ktx2",".dds",".astc",".atlas",".fnt",".ttf",".otf",".lua",".ini",".cfg",".dat"}
          keywords = ("menu","option","setting","graphic","quality","resolution","button","ui","hud","font","texture","shader","render","screen","language","localiz","pref","gameoption")
          rows=[]
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob("*"):
              if not p.is_file(): continue
              try:
                if not zipfile.is_zipfile(p): continue
                with zipfile.ZipFile(p) as z:
                  for info in z.infolist():
                    if info.is_dir(): continue
                    name=info.filename
                    low=name.lower()
                    ext=Path(name).suffix.lower()
                    if ext in wanted_ext or any(k in low for k in keywords):
                      rows.append((str(p), info.file_size, name))
              except Exception as e:
                rows.append((str(p), -1, "SCAN_ERROR: "+str(e)))
          rows.sort(key=lambda r:(r[0].lower(),r[2].lower()))
          with out.open("w", encoding="utf-8") as f:
            f.write("container\tsize_bytes\tentry\n")
            for row in rows: f.write("\t".join(map(str,row))+"\n")
          print(f"Indexed {len(rows)} candidate entries into {out}")
          PY
          : > reports/asphalt8-ui-resource-hints.txt
          while IFS= read -r apk; do
            echo "===== $apk =====" >> reports/asphalt8-ui-resource-hints.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$apk" 2>/dev/null |
              grep -iE 'setting|option|graphic|quality|resolution|button|menu|language|display|effect|frame|fps|render|texture' |
              head -n 120 >> reports/asphalt8-ui-resource-hints.txt || true
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml 2>/dev/null |
              grep -iE 'activity|application|surface|texture|game|launch|orientation|configChanges' |
              head -n 100 >> reports/asphalt8-ui-resource-hints.txt || true
          done < <(find acquired -type f -name '*.apk' | sort)
          echo "Read-only inventory only: no game files were modified, patched, or re-signed." >> reports/asphalt8-ui-resource-hints.txt

      - name: Extract native GameOptions and menu symbol hints
        shell: bash
        run: |
          set -euo pipefail
          : > reports/asphalt8-native-ui-options-hints.txt
          while IFS= read -r apk; do
            if unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libAsphalt8\\.so
        uses: actions/upload-artifact@v4
        with:
          name: Asphalt8-acquired-source-and-inspection
          path: |
            acquired/raw/**
            acquired/extracted/**
            reports/asphalt8-inspection.txt
            reports/asphalt8-resource-inventory.tsv
            reports/asphalt8-ui-resource-hints.txt
            reports/asphalt8-native-ui-options-hints.txt
          if-no-files-found: error
          retention-days: 3
; then
              echo "===== Native library: $apk =====" >> reports/asphalt8-native-ui-options-hints.txt
              tmp="$(mktemp)"
              unzip -p "$apk" lib/arm64-v8a/libAsphalt8.so > "$tmp"
              strings -a "$tmp" | grep -iE 'GameOptions|scaleDisplay|GFXOption|useShadows|options_menu/|ingame_menu/|visual_quality|STR_MENU_SOUND_AND_DISPLAY|OPTIONS_CONTROLS' | sort -u | head -n 240 >> reports/asphalt8-native-ui-options-hints.txt || true
              rm -f "$tmp"
            fi
            python3 - "$apk" <<'PY' >> reports/asphalt8-native-ui-options-hints.txt
          import json, sys, zipfile
          apk=sys.argv[1]
          try:
              with zipfile.ZipFile(apk) as z:
                  names=[n for n in z.namelist() if n.lower().endswith('/gameoptions.json') or n.lower()=='gameoptions.json']
                  for name in names:
                      data=json.loads(z.read(name))
                      profiles=data.get('profiles',{})
                      print(f"\\n===== Embedded config: {apk}:{name} =====")
                      print("header:", data.get("header"))
                      print("profiles:", ", ".join(profiles))
                      gpu=profiles.get("GPU",{})
                      defaults=gpu.get("defaults",[])
                      for group in defaults:
                          for group_name, entries in group.items():
                              selected={e[0]:e[1] for e in entries if isinstance(e,list) and len(e)>1 and e[0] in {"GFXOption","FPSLimit","defaultTextureFiltering","useShadows","postFX"}}
                              print("GPU defaults:", selected)
                      spec=profiles.get("Specific",{}).get("overrides",{})
                      scales={k:v.get("scaleDisplay") for k,v in spec.items() if k.startswith("RES_") and isinstance(v,dict) and "scaleDisplay" in v}
                      print("Existing RES_ scaleDisplay overrides:", scales)
          except Exception as e:
              print(f"Config scan skipped for {apk}: {e}")
          PY
          done < <(find acquired -type f -name '*.apk' | sort)
          echo "String matches are discovery hints only; they do not prove a menu injection point or runtime file precedence." >> reports/asphalt8-native-ui-options-hints.txt

      - name: Upload acquired APKs and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: Asphalt8-acquired-source-and-inspection
          path: |
            acquired/raw/**
            acquired/extracted/**
            reports/asphalt8-inspection.txt
            reports/asphalt8-resource-inventory.tsv
            reports/asphalt8-ui-resource-hints.txt
          if-no-files-found: error
          retention-days: 3
