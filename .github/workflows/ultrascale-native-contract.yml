name: UltraScale native contract

on:
  push:
    branches:
      - feature/ultrascale-mobile-api-injection-lab
    paths:
      - "experiments/UltraScaleMobile/unity-backend/native/**"
      - "experiments/UltraScaleMobile/unity-backend/include/**"
      - ".github/workflows/ultrascale-native-contract.yml"
  pull_request:
    paths:
      - "experiments/UltraScaleMobile/unity-backend/native/**"
      - "experiments/UltraScaleMobile/unity-backend/include/**"
      - ".github/workflows/ultrascale-native-contract.yml"

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S experiments/UltraScaleMobile/unity-backend/native -B build/ultrascale-native -DCMAKE_BUILD_TYPE=Release -DULTRASCALE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ultrascale-native --parallel
      - name: Test ABI and host fallback
        run: ctest --test-dir build/ultrascale-native --output-on-failure

  android-gles-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Configure Android GLES backend
        run: >-
          cmake -S experiments/UltraScaleMobile/unity-backend/native
          -B build/ultrascale-android-arm64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DANDROID_STL=c++_shared
      - name: Build Android GLES backend
        run: cmake --build build/ultrascale-android-arm64 --parallel
